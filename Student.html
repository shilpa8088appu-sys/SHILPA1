<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"], select {
            width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;
        }
        .gender-group { margin-top: 5px; }
        button { margin-top: 15px; padding: 10px 15px; background: #007BFF; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2>Student Registration Form</h2>
    <form action="#" method="post">
        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll" required>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email" required>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <label>Gender:</label>
        <div class="gender-group">
            <input type="radio" id="male" name="gender" value="Male"> <label for="male" style="display:inline; font-weight:normal;">Male</label>
            <input type="radio" id="female" name="gender" value="Female"> <label for="female" style="display:inline; font-weight:normal;">Female</label>
        </div>

        <label for="course">Select Course:</label>
        <select id="course" name="course">
            <option value="cse">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="ece">Electronics</option>
            <option value="mech">Mechanical</option>
        </select>

        <button type="submit">Register</button>
    </form>

</body>
</html>
